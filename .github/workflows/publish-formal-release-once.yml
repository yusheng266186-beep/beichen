name: one-time publish formal release

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-formal-release-once.yml

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out private handover repository
        uses: actions/checkout@v4
        with:
          path: handover

      - name: Publish release through GitHub API
        shell: bash
        env:
          FORMAL_REPOSITORY: yusheng266186-beep/beichen
          RELEASE_TAG: v2.7.0-stateful
          RELEASE_TITLE: 北辰 v2.7.0-stateful · 页面 v2.6.20
          TARGET_COMMIT: 5a20b8105390e2e63b606a6f2e26b71e5448d0df
        run: |
          node <<'NODE'
          const fs = require('fs');

          function findTokens(text) {
            const candidates = [];
            const add = value => {
              const cleaned = String(value || '').trim().replace(/^[\`"'“”‘’]+|[\`"'“”‘’]+$/g, '');
              if (!cleaned || cleaned.length < 20) return;
              if (/^(your|replace|example|填写|填入|这里|token|api|github|secret|password|xxxxx)/i.test(cleaned)) return;
              candidates.push(cleaned);
            };
            const addMatches = value => {
              const source = String(value || '');
              for (const match of source.match(/[A-Za-z0-9][A-Za-z0-9_+\\/=.\-]{19,}/g) || []) add(match);
            };
            for (const pattern of [
              /github_pat_[A-Za-z0-9_]+/g,
              /ghp_[A-Za-z0-9]+/g,
              /gho_[A-Za-z0-9]+/g,
              /ghs_[A-Za-z0-9]+/g,
              /ghu_[A-Za-z0-9]+/g,
              /ghr_[A-Za-z0-9]+/g
            ]) {
              for (const value of text.match(pattern) || []) add(value);
            }

            let labeledLinePending = false;
            for (const line of text.split(/\r?\n/)) {
              const isGithubCredentialLine = /(github|git[ _-]?hub|gh)[^\r\n]{0,80}(token|api|pat|令牌|密钥|推送|上传)/i.test(line);
              if (isGithubCredentialLine) {
                const parts = line.split(/[:：=]/);
                if (parts.length > 1) addMatches(parts.slice(1).join(':'));
                else addMatches(line.match(/\`([^\`]+)\`/g)?.join(' '));
                labeledLinePending = candidates.length === 0;
                continue;
              }
              if (labeledLinePending && line.trim()) {
                addMatches(line);
                labeledLinePending = false;
              }
            }
            return Array.from(new Set(candidates));
          }

          async function githubRequest(token, path, method = 'GET', payload) {
            const response = await fetch('https://api.github.com' + path, {
              method,
              headers: {
                Accept: 'application/vnd.github+json',
                Authorization: 'Bearer ' + token,
                'X-GitHub-Api-Version': '2022-11-28',
                ...(payload ? { 'Content-Type': 'application/json' } : {})
              },
              body: payload ? JSON.stringify(payload) : undefined
            });
            const raw = await response.text();
            let data = {};
            try { data = JSON.parse(raw); } catch (_) {}
            if (!response.ok) {
              const error = new Error('GITHUB_API_' + response.status);
              error.status = response.status;
              throw error;
            }
            return data;
          }

          async function main() {
            const handover = fs.readFileSync('handover/操作执行清单.md', 'utf8');
            const candidates = findTokens(handover);
            console.log('Credential candidate count: ' + candidates.length + ', lengths=' + candidates.map(value => value.length).join(','));
            let token = '';
            for (const candidate of candidates) {
              process.stdout.write('::add-mask::' + candidate + '\n');
              try {
                await githubRequest(candidate, '/repos/' + process.env.FORMAL_REPOSITORY);
                token = candidate;
                break;
              } catch (_) {}
            }
            if (!token) throw new Error('GITHUB_API_TOKEN_NOT_FOUND_OR_UNAUTHORIZED');

            const encoded = await githubRequest(
              token,
              '/repos/' + process.env.FORMAL_REPOSITORY + '/contents/CHANGELOG.md?ref=main'
            );
            const body = Buffer.from(String(encoded.content || '').replace(/\n/g, ''), 'base64').toString('utf8');
            if (!body.includes('v2.7.0-stateful') || !body.includes('ready: true')) {
              throw new Error('CHANGELOG_CONTENT_INCOMPLETE');
            }

            const tag = process.env.RELEASE_TAG;
            const title = process.env.RELEASE_TITLE;
            const target = process.env.TARGET_COMMIT;
            const base = '/repos/' + process.env.FORMAL_REPOSITORY;
            let release;
            try {
              const current = await githubRequest(
                token,
                base + '/releases/tags/' + encodeURIComponent(tag)
              );
              release = await githubRequest(
                token,
                base + '/releases/' + current.id,
                'PATCH',
                { name: title, body, draft: false, prerelease: false }
              );
            } catch (error) {
              if (error.status !== 404) throw error;
              release = await githubRequest(
                token,
                base + '/releases',
                'POST',
                {
                  tag_name: tag,
                  target_commitish: target,
                  name: title,
                  body,
                  draft: false,
                  prerelease: false,
                  generate_release_notes: false
                }
              );
            }

            if (release.tag_name !== tag || release.name !== title || !String(release.body || '').includes('ready: true')) {
              throw new Error('RELEASE_VERIFICATION_FAILED');
            }
            console.log('Release published: ' + release.html_url);
          }

          main().catch(error => {
            console.error('Release failed: ' + (error.message || 'UNKNOWN'));
            process.exitCode = 1;
          });
          NODE
