name: one-time create formal release

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/create-release-once.yml

permissions:
  contents: write

jobs:
  publish:
    if: ${{ !contains(github.event.head_commit.message, 'remove one-time release workflow') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out formal repository
        uses: actions/checkout@v4

      - name: Create release through GitHub API
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: v2.7.0-stateful
          RELEASE_TITLE: 北辰 v2.7.0-stateful · 页面 v2.6.20
          TARGET_SHA: ${{ github.event.before }}
        with:
          script: |
            const fs = require('fs');
            const tag = process.env.RELEASE_TAG;
            const title = process.env.RELEASE_TITLE;
            const body = fs.readFileSync('CHANGELOG.md', 'utf8');
            const target = process.env.TARGET_SHA && !/^0+$/.test(process.env.TARGET_SHA)
              ? process.env.TARGET_SHA
              : context.sha;
            const { owner, repo } = context.repo;
            let release;
            try {
              const current = await github.rest.repos.getReleaseByTag({
                owner,
                repo,
                tag
              });
              const updated = await github.rest.repos.updateRelease({
                owner,
                repo,
                release_id: current.data.id,
                name: title,
                body,
                target_commitish: target,
                draft: false,
                prerelease: false
              });
              release = updated.data;
            } catch (error) {
              if (error.status !== 404) throw error;
              const created = await github.rest.repos.createRelease({
                owner,
                repo,
                tag_name: tag,
                target_commitish: target,
                name: title,
                body,
                draft: false,
                prerelease: false,
                generate_release_notes: false
              });
              release = created.data;
            }
            core.info('Release published: ' + release.html_url);

      - name: Remove one-time release workflow
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const path = '.github/workflows/create-release-once.yml';
            const { owner, repo } = context.repo;
            const current = await github.rest.repos.getContent({
              owner,
              repo,
              path,
              ref: 'main'
            });
            const sha = Array.isArray(current.data) ? current.data[0].sha : current.data.sha;
            await github.rest.repos.deleteFile({
              owner,
              repo,
              path,
              message: 'chore: remove one-time release workflow',
              sha,
              branch: 'main'
            });
            core.info('Temporary release workflow removed.');
